<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1360">
<title>祥和康养 · 数据化系统 v2.0（PC 端演示）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Lora:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --pri:#2E7D6B; --pri-l:#E8F0EE; --pri-d:#245F51; --pri-xd:#1B4A3E;
  --warn:#E8A33D; --warn-l:#FDF3E3;
  --dan:#C0392B; --dan-l:#FBEAE8;
  --bg:#FAF9F5; --card:#FFFFFF; --tx:#141413; --mut:#8A857A;
  --line:#E8E6DC; --line2:#F0EEE6;
  --blue:#4A7BAA; --blue-l:#EDF2F8;
  --purple:#6B5FA8; --purple-l:#F0EEF9;
  --acc:#D97757; --acc-d:#C05F3F; --acc-l:#F9EDE6;
  --ink:#141413; --paper:#FAF9F5;
  --sh-sm:0 1px 2px rgba(20,20,19,.04),0 2px 10px rgba(20,20,19,.04);
  --sh-md:0 2px 4px rgba(20,20,19,.05),0 10px 28px rgba(20,20,19,.09);
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--tx);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;min-width:1280px;
  background:
    radial-gradient(1100px 560px at 88% -120px, rgba(217,119,87,.07), transparent 62%),
    radial-gradient(900px 520px at -120px 32%, rgba(46,125,107,.06), transparent 60%),
    var(--bg);
  background-attachment:fixed}
a{text-decoration:none;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}

/* ===================== 官网（未登录） ===================== */
.stnav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);height:66px;display:flex;align-items:center;padding:0 40px;gap:30px}
.stnav .brand{font-size:19px;font-weight:800;color:var(--pri-d);letter-spacing:-.3px;line-height:1.2;cursor:pointer}
.stnav .brand small{display:block;font-size:10px;color:var(--mut);font-weight:500;letter-spacing:1.5px;margin-top:1px}
.stnav .nl{font-size:14px;color:#3E4C49;cursor:pointer;padding:6px 2px;border-bottom:2px solid transparent;transition:.15s}
.stnav .nl:hover{color:var(--pri);border-bottom-color:var(--pri)}
.btn-login{margin-left:auto;font-family:inherit;font-size:13.5px;font-weight:600;padding:9px 22px;border-radius:8px;border:1px solid var(--pri);background:var(--pri);color:#fff;cursor:pointer;transition:.15s}
.btn-login:hover{background:var(--pri-d)}
.hero{background:linear-gradient(135deg,#173B32 0%,#245F51 45%,#2E7D6B 75%,#43947F 100%);color:#fff;padding:88px 0 0;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-120px;top:-80px;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 65%)}
.hero .wrap{position:relative;z-index:2}
.hero .tag{display:inline-block;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:5px 16px;font-size:12.5px;letter-spacing:2px;margin-bottom:22px}
.hero h1{font-size:42px;font-weight:800;letter-spacing:-.5px;line-height:1.3}
.hero h1 em{font-style:normal;color:#F2D8A7}
.hero p.sub{font-size:15.5px;opacity:.88;margin-top:18px;max-width:640px;line-height:1.9}
.hero .cta{margin-top:30px;display:flex;gap:12px}
.hero .cta button{font-family:inherit;font-size:14px;font-weight:600;padding:12px 26px;border-radius:8px;border:none;cursor:pointer;transition:.15s}
.hero .cta .b1{background:#fff;color:var(--pri-d)}
.hero .cta .b1:hover{background:#EAF3F0}
.hero .cta .b2{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.55)}
.hero .cta .b2:hover{background:rgba(255,255,255,.1)}
.hstats{margin-top:52px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:14px 14px 0 0;display:grid;grid-template-columns:repeat(4,1fr);backdrop-filter:blur(4px)}
.hstats .hs{padding:22px 30px;border-right:1px solid rgba(255,255,255,.14)}
.hstats .hs:last-child{border-right:none}
.hstats .hv{font-size:30px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.hstats .hv small{font-size:13px;font-weight:500;opacity:.8;margin-left:2px}
.hstats .hk{font-size:12px;opacity:.75;margin-top:4px}
.site-sec{background:#fff;padding:66px 0}
.site-sec.alt{background:#F6F9F8}
.sec-head{text-align:center;margin-bottom:38px}
.sec-head .st{font-size:26px;font-weight:800;letter-spacing:-.3px}
.sec-head .sd{font-size:13.5px;color:var(--mut);margin-top:10px}
.sec-head .bar-c{width:44px;height:4px;background:var(--pri);border-radius:2px;margin:14px auto 0}
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.svc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px 24px 20px;transition:.2s;position:relative;overflow:hidden}
.site-sec.alt .svc{border-color:#E7EEEB}
.svc:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(30,60,54,.1);border-color:#BFD8D0}
.svc .ic{width:46px;height:46px;border-radius:11px;background:var(--pri-l);color:var(--pri-d);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:14px}
.svc.hot .ic{background:var(--warn-l)}
.svc h3{font-size:16.5px;font-weight:700;margin-bottom:8px}
.svc p{font-size:12.5px;color:var(--mut);line-height:1.8}
.svc .hot-tag{position:absolute;top:14px;right:-30px;background:var(--warn);color:#fff;font-size:10.5px;font-weight:600;padding:3px 34px;transform:rotate(38deg)}
.pay-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.pay-c{border-radius:12px;padding:22px 20px;border:1px solid var(--line);background:#fff;border-top:4px solid var(--pri)}
.pay-c.m{border-top-color:var(--blue)}
.pay-c.l{border-top-color:var(--warn)}
.pay-c.y{border-top-color:var(--purple)}
.pay-c .pt{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.pay-c .pd{font-size:12px;color:var(--mut);margin-top:9px;line-height:1.8}
.pay-c .pe{margin-top:10px;font-size:11.5px;font-weight:600;color:var(--pri-d);background:var(--pri-l);border-radius:6px;padding:5px 9px;display:inline-block}
.pay-c.m .pe{color:var(--blue);background:var(--blue-l)}
.pay-c.l .pe{color:#8A5A05;background:var(--warn-l)}
.pay-c.y .pe{color:var(--purple);background:var(--purple-l)}
.flow{display:flex;gap:0;position:relative}
.flow .fs{flex:1;text-align:center;position:relative;padding:0 10px}
.flow .fs::before{content:'';position:absolute;top:23px;left:calc(50% + 26px);right:calc(-50% + 26px);height:2px;background:#D6E4DF}
.flow .fs:last-child::before{display:none}
.flow .fn{width:46px;height:46px;border-radius:50%;background:var(--pri);color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;position:relative;z-index:2}
.flow .fs:nth-child(2) .fn{background:#3E927E}.flow .fs:nth-child(3) .fn{background:#4FA38D}
.flow .fs:nth-child(4) .fn{background:#63B49C}.flow .fs:nth-child(5) .fn{background:#79C2AB}
.flow .ft{font-size:14.5px;font-weight:700}
.flow .fd{font-size:11.5px;color:var(--mut);margin-top:6px;line-height:1.7}
.news-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.news{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:.2s}
.news:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(30,60,54,.1)}
.news .nc{height:96px;position:relative;display:flex;align-items:flex-end;padding:12px 14px}
.news .nc .nd{background:rgba(255,255,255,.92);border-radius:6px;font-size:10.5px;color:var(--pri-d);font-weight:600;padding:3px 8px}
.news .nb{padding:14px 16px 16px}
.news .nt{font-size:13.5px;font-weight:700;line-height:1.55}
.news .ns{font-size:11.5px;color:var(--mut);margin-top:8px;line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.team-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tm{background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px 22px;text-align:center;transition:.2s}
.tm:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(30,60,54,.1)}
.tm .av{width:64px;height:64px;border-radius:50%;margin:0 auto 13px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#fff}
.tm .av.c1{background:linear-gradient(135deg,#2E7D6B,#4FA38D)}
.tm .av.c2{background:linear-gradient(135deg,#3F6FB5,#6B93CC)}
.tm .av.c3{background:linear-gradient(135deg,#8A6FBF,#A78FD4)}
.tm .av.c4{background:linear-gradient(135deg,#C98A3D,#DFAE6C)}
.tm h4{font-size:16px;font-weight:700}
.tm .tt{font-size:11.5px;color:var(--pri-d);font-weight:600;margin-top:4px}
.tm p{font-size:11.5px;color:var(--mut);margin-top:10px;line-height:1.8}
.honor-wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:30px;align-items:center}
.about-p{font-size:13.5px;line-height:2.1;color:#3E4C49}
.honors{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hon{background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 15px;display:flex;gap:10px;align-items:center;font-size:12.5px;font-weight:600}
.hon .medal{font-size:18px}
.sfooter{background:#1B4A3E;color:#fff;padding:44px 0 0}
.sfooter .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:30px;padding-bottom:34px}
.sfooter h5{font-size:14px;font-weight:700;margin-bottom:14px;opacity:.95}
.sfooter .fi{font-size:12px;opacity:.72;line-height:2.1}
.sfooter .bt{border-top:1px solid rgba(255,255,255,.14);padding:15px 0;text-align:center;font-size:11.5px;opacity:.55}

/* ===================== 登录页 ===================== */
.login{min-height:100vh;background:linear-gradient(135deg,#173B32 0%,#2E7D6B 70%,#43947F 100%);display:flex;align-items:center;justify-content:center;padding:40px 20px;position:relative;overflow:hidden}
.login::before{content:'';position:absolute;left:-140px;bottom:-160px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.1),transparent 65%)}
.login-card{background:#fff;border-radius:16px;padding:36px 38px;width:460px;max-width:100%;position:relative;z-index:2;box-shadow:0 24px 60px rgba(10,30,25,.35)}
.login-card .lg{font-size:21px;font-weight:800;color:var(--pri-d);text-align:center}
.login-card .ls{text-align:center;font-size:12px;color:var(--mut);margin:7px 0 24px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;color:var(--mut);margin-bottom:6px;font-weight:600}
.fld input{width:100%;font-family:inherit;font-size:13.5px;padding:11px 13px;border:1px solid var(--line);border-radius:8px;outline:none;transition:.15s}
.fld input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(46,125,107,.1)}
.role-tip{font-size:12px;color:var(--mut);margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.role-tip::before,.role-tip::after{content:'';flex:1;height:1px;background:var(--line)}
.role-row{display:flex;flex-wrap:wrap;gap:8px}
.role-chip{font-family:inherit;font-size:12px;font-weight:600;padding:8px 13px;border-radius:18px;border:1px solid var(--line);background:#FAFCFB;color:#3E4C49;cursor:pointer;transition:.15s}
.role-chip:hover{border-color:var(--pri);color:var(--pri-d);background:var(--pri-l)}
.login .btn-login{width:100%;margin:22px 0 0;padding:12px;font-size:14.5px;border-radius:9px}
.login-back{text-align:center;margin-top:16px;font-size:12px;color:var(--mut);cursor:pointer}
.login-back:hover{color:var(--pri)}

/* ===================== 系统框架 ===================== */
.topnav{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:0 22px;position:sticky;top:0;z-index:80}
.topnav .brand{font-size:15.5px;font-weight:800;color:var(--pri-d);margin-right:20px;white-space:nowrap;letter-spacing:-.2px}
.topnav .brand small{display:inline-block;font-size:9.5px;color:#fff;background:var(--pri);border-radius:4px;padding:1px 6px;margin-left:6px;font-weight:600;vertical-align:2px;letter-spacing:1px}
.tnav-item{padding:0 17px;height:60px;display:flex;align-items:center;font-size:13.5px;color:#3E4C49;cursor:pointer;border-bottom:2.5px solid transparent;font-weight:600;transition:.12s;gap:6px}
.tnav-item:hover{color:var(--pri)}
.tnav-item.on{color:var(--pri-d);border-bottom-color:var(--pri)}
.topnav .sp{flex:1}
.selwrap{display:flex;align-items:center;gap:6px;margin-right:14px}
.selwrap label{font-size:11.5px;color:var(--mut);white-space:nowrap}
select{font-family:inherit;font-size:12.5px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--tx);cursor:pointer;outline:none}
select:focus{border-color:var(--pri)}
.who{display:flex;align-items:center;gap:9px;font-size:12.5px}
.who .wrole{font-size:10.5px;color:var(--pri-d);background:var(--pri-l);border-radius:5px;padding:2px 7px;font-weight:600}
.who .av{width:30px;height:30px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600}
.who .out{font-size:11.5px;color:var(--mut);cursor:pointer;padding:4px 8px;border-radius:6px}
.who .out:hover{color:var(--dan);background:var(--dan-l)}
.subnav{height:44px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:0 22px;position:sticky;top:60px;z-index:79;overflow-x:auto}
.subnav-item{padding:5px 14px;border-radius:17px;font-size:12.5px;color:var(--mut);cursor:pointer;white-space:nowrap;transition:.12s}
.subnav-item:hover{background:#F0F4F2;color:var(--pri-d)}
.subnav-item.on{background:var(--pri-l);color:var(--pri-d);font-weight:600}
.subnav .gap{width:8px}
.appbody{padding:16px 22px 60px;max-width:1400px;margin:0 auto}

/* ===================== 通用组件 ===================== */
h1.pt{font-size:19px;font-weight:700;letter-spacing:-.3px}
.psub{font-size:12px;color:var(--mut);margin-top:4px}
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.card.np{padding:0;overflow:hidden}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ct{font-size:13.5px;font-weight:700}
.ct small{font-size:11px;font-weight:400;color:var(--mut);margin-left:7px}
.i{width:16px;height:16px;border-radius:50%;border:1px solid #C6D3CF;color:#8FA39E;font-size:10px;font-style:italic;font-family:Georgia,serif;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 16px;transition:.12s}
.i:hover{background:var(--pri-l);color:var(--pri-d);border-color:var(--pri)}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:600;white-space:nowrap}
.pill.g{background:var(--pri-l);color:var(--pri-d)}
.pill.y{background:var(--warn-l);color:#8A5A05}
.pill.r{background:var(--dan-l);color:var(--dan)}
.pill.b{background:var(--blue-l);color:var(--blue)}
.pill.p{background:var(--purple-l);color:var(--purple)}
.pill.n{background:#F0F3F2;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 15px;transition:.15s}
.kpi:hover{box-shadow:0 4px 14px rgba(30,60,54,.07)}
.kpi.click{cursor:pointer}
.kpi.click:hover{border-color:var(--pri)}
.kpi .k{font-size:11.5px;color:var(--mut);display:flex;align-items:center;gap:5px}
.kpi .v{font-size:25px;font-weight:700;letter-spacing:-.8px;margin:7px 0 3px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:12px;font-weight:500;color:var(--mut);letter-spacing:0}
.kpi .c{font-size:10.5px;color:var(--mut);line-height:1.45}
.kpi .c.y{color:#8A5A05}.kpi .c.r{color:var(--dan)}.kpi .c.g{color:var(--pri)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:11px;color:var(--mut);font-weight:600;padding:9px 10px;background:#FBFCFB;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:hover{background:#F9FBFA}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.sum td{background:#F7FAF9;font-weight:700;border-top:1.5px solid var(--line)}
.lk{color:var(--pri);font-weight:600;cursor:pointer;font-size:12px}
.lk:hover{text-decoration:underline}
.hint{font-size:11px;color:var(--mut);line-height:1.65}
.note{background:#FBFCFB;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:11.5px;color:#5E6E6A;line-height:1.65}
.note.y{background:var(--warn-l);border-color:#F2E1C0;color:#8A5A05}
.note.r{background:var(--dan-l);border-color:#F0CDC8;color:#8A2E22}
.note.b{background:var(--blue-l);border-color:#D3E2F3;color:#22527F}
.note.g{background:var(--pri-l);border-color:#CBE0DA;color:var(--pri-d)}
.bar{display:flex;height:26px;border-radius:6px;overflow:hidden;font-size:10px;color:#fff;font-weight:600;margin:8px 0 6px}
.bar div{display:flex;align-items:center;justify-content:center}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tab{padding:8px 15px;font-size:12.5px;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;transition:.12s;white-space:nowrap}
.tab:hover{color:var(--pri)}
.tab.on{color:var(--pri-d);font-weight:600;border-bottom-color:var(--pri)}
.btn{font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:7px;border:1px solid var(--pri);background:var(--pri);color:#fff;cursor:pointer;transition:.12s;white-space:nowrap}
.btn:hover{background:var(--pri-d)}
.btn.gh{background:#fff;color:var(--pri)}
.btn.gh:hover{background:var(--pri-l)}
.btn.sm{padding:4px 10px;font-size:11.5px;border-radius:6px}
.btn.dn{background:var(--dan);border-color:var(--dan)}
.btn.dn:hover{background:#A93226}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.acc{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden}
.acc .ah{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;cursor:pointer;font-size:12.5px;font-weight:600;background:#FBFCFB;gap:8px}
.acc .ab{display:none;padding:0 13px 12px;font-size:12px;line-height:1.75;color:#3E4C49}
.acc.open .ab{display:block}
.acc .ar{font-size:10px;color:var(--mut);transition:.2s}
.acc.open .ar{transform:rotate(90deg)}

/* 床位图 */
.bedwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.bed{height:48px;border-radius:7px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;cursor:pointer;transition:.12s;line-height:1.25}
.bed:hover{transform:translateY(-2px);box-shadow:0 3px 9px rgba(30,60,54,.14);border-color:var(--pri)}
.bed .bn{font-weight:700;font-size:10.5px}
.bed.live{background:#DFF0EB;border-color:#A9D3C9;color:var(--pri-d)}
.bed.res{background:#FDF3E3;border-color:#EFD9B0;color:#8A5A05}
.bed.idle{background:#fff;color:#9AAA9F}
.bed.maint{background:#EDF1EF;border-color:#D5DEDA;color:#8A9A95}
.bed.iso{background:#FBEDE9;border-color:#F0CFC7;color:#9B4436}

function mzLevel(total){
  if(S.rules.coma) return {name:'完全失能',range:'直接判定',idx:4};
  let base;
  if(total>=90) base={name:'能力完好',range:'≥ 90',idx:0};
  else if(total>=66) base={name:'轻度失能',range:'66–89',idx:1};
  else if(total>=46) base={name:'中度失能',range:'46–65',idx:2};
  else if(total>=30) base={name:'重度失能',range:'30–45',idx:3};
  else base={name:'完全失能',range:'0–29',idx:4};
  const up=(S.rules.dementia?1:0)+(S.rules.event?1:0);
  if(up>0&&!S.rules.coma){
    const N=['能力完好','轻度失能','中度失能','重度失能','完全失能'];
    const R=['≥ 90','66–89','46–65','30–45','0–29'];
    const ni=Math.min(4,base.idx+up);
    return {name:N[ni],range:R[ni],idx:ni,raised:true,orig:base.name,origR:base.range};
  }
  return base;
}
function lisLevel(total){
  if(S.rules.coma) return {name:'5 级（重度Ⅲ级）',idx:5};
  let i = total>=90?0: total>=66?1: total>=46?2: total>=30?3: total>=20?4:5;
  if(S.rules.dementia||S.rules.event) i=Math.min(5,i+1);
  return {name:['0 级（基本正常）','1 级（轻度失能）','2 级（中度失能）','3 级（重度Ⅰ级）','4 级（重度Ⅱ级）','5 级（重度Ⅲ级）'][i], idx:i};
}

    ${d.todos.map(t=>`<div class="note ${t[2]==='待办'?'y':''}" style="margin-bottom:5px">【${t[0]}】${t[1]} · ${t[2]}</div>`).join('')}
    <div class="mft" style="justify-content:flex-start"><button class="btn sm" onclick="closeModal();viewElder('${b.eid}')">查看完整老人档案 ›</button></div>`;
  } else {
    const changes = {res:[['11-05 09:12','空置 → 预留','新签约','销售 · 吴倩']],
      maint:[['11-04 16:30','可运营 → 维修','墙面粉刷','后勤 · 王工']],

function filterElders(){
  const f=S.filters;
  return ELDERS.filter(e=>{
    const q=(f.elderSearch||'').trim();
    if(q && !(e.name.includes(q)||e.id.toLowerCase().includes(q.toLowerCase())||e.bed.toLowerCase().includes(q.toLowerCase()))) return false;
    if(f.elderMz && e.mz!==f.elderMz) return false;
    if(f.elderAid && e.aid!==f.elderAid) return false;
    if(f.elderStatus && e.status!==f.elderStatus) return false;
    return true;
  });
}

/* 参数编辑弹层 */
function editPolicy(label,rows){
  openModal('编辑 · '+label,'当前版本 v'+S.policyVer+' · 保存后立即生效并生成 v'+(S.policyVer+1),
    rows.map(r=>`<div class="field-row"><span class="fk">${r[0]}</span><input value="${r[1]}"></div>`).join('')+
    `<div class="note y" style="margin-top:10px">参数变更将影响：评估换算结果、结算金额、补贴基数。保存后系统自动重算受影响账单并生成变更日志。</div>`, true);
  $('#mCancel').onclick=()=>{ closeAndVer(); };
}
function closeAndVer(){ closeModal(); S.policyVer++; render(); toast('参数已保存 · 版本已升级至 v'+S.policyVer+' · 变更日志已归档'); }
/* ---- Tab3 评估人信息 ---- */
function assessStatus(e){
  const days=Math.round((new Date(e.reDate)-new Date('2026-11-05'))/86400000);
  if(e.reDate==='—') return ['n','—'];
  if(days<0) return ['r','已过期'];
  if(days<=30) return ['y','即将到期'];
  return ['g','有效'];
}
function filterPersons(){
  const f=S.filters;
  return ELDERS.filter(e=>{
    const q=(f.personSearch||'').trim();
    if(q && !(e.name.includes(q)||e.id.toLowerCase().includes(q.toLowerCase())||e.bed.toLowerCase().includes(q.toLowerCase()))) return false;
    if(f.personMz){
      const st=assessStatus(e)[1];
      if(st!==f.personMz) return false;
    }
    return true;
  });
}
function renderPersonRows(){
  const list=filterPersons();
  const tb=$('#personTbody'); if(!tb) return;
  tb.innerHTML=list.length?list.map(e=>{
    const st=assessStatus(e);
    const last=ELDER_DETAIL[e.id]?ELDER_DETAIL[e.id].assessList[0]:{date:e.inDate,type:'入住评估',by:'王芳 / 周琳'};
    return `<tr>
      <td style="font-family:monospace;font-size:11.5px">${e.id}</td><td><b>${e.name}</b></td>
      <td>${e.sex} / ${e.age}</td><td>${e.bed}</td><td>${e.inDate}</td>
      <td><span class="pill ${e.mz.includes('完全')?'r':e.mz.includes('重度')?'y':e.mz.includes('中度')?'b':'n'}">${e.mz}</span></td>
      <td><span class="pill b">长护险 ${e.lis}</span></td>
      <td>${last.date}</td><td>${e.reDate}</td>
      <td><span class="pill ${st[0]}">${st[1]}</span></td>
      <td><button class="btn sm" onclick="S.formElder='${e.id}';S.tab.assess='form';render();toast('已进入重新评估（${e.name}）')">再次评估</button>
          <button class="btn gh sm" onclick="viewElder('${e.id}')">查看详情</button></td></tr>`;
  }).join(''):'<tr><td colspan="11" class="empty-tip">无符合条件的记录</td></tr>';
  const c=$('#personCnt'); if(c) c.textContent=`共 ${list.length} 位长者`;
}
function assessPersons(){
  const f=S.filters;
  setTimeout(renderPersonRows,0);
  const due=ELDERS.filter(e=>assessStatus(e)[1]==='即将到期');
  return `
  <div class="note y" style="margin-bottom:12px">⏰ 复评预警（30 天内到期 ${due.length} 人）：${due.map(e=>`<b>${e.name}</b>（${e.reDate}）`).join('、')}。
  未按期复评将影响护理补贴与长护险结算，<b>系统提前 30 天生成待办</b>。</div>
  <div class="filter-bar">
    <input placeholder="搜索：姓名 / 老人ID / 床位号" value="${esc(f.personSearch)}" oninput="S.filters.personSearch=this.value;renderPersonRows()">
    <select onchange="S.filters.personMz=this.value;renderPersonRows()">
      <option value="">评估状态（全部）</option>
      ${['有效','即将到期','已过期','—'].map(x=>`<option ${f.personMz===x?'selected':''}>${x}</option>`).join('')}
    </select>
    <select onchange="renderPersonRows()"><option>评估类型（全部）</option><option>入住评估</option><option>年度复评</option><option>风险事件后复评</option></select>
    <span class="hint" id="personCnt" style="margin-left:auto"></span>

  <table><thead><tr>
    <th>老人ID</th><th>姓名</th><th>性别/年龄</th><th>床位号</th><th>入住日期</th>
